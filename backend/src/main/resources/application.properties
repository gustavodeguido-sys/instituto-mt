# Configurações comuns a todos os ambientes (sem segredos — este arquivo vai para o git).
spring.application.name=backend
server.port=8080

# Perfil usado quando nenhum outro é informado: carrega application-local.properties,
# onde ficam as credenciais do banco da sua máquina. Em produção, ativar outro perfil
# (ex.: SPRING_PROFILES_ACTIVE=prod) com as credenciais vindas de variáveis de ambiente.
spring.profiles.default=local

# Quem cria/altera tabelas é o Flyway (src/main/resources/db/migration).
# "validate" faz o Hibernate só conferir se as entidades batem com as tabelas
# e falhar na inicialização se houver divergência — nunca altera o banco sozinho.
spring.jpa.hibernate.ddl-auto=validate

# Desliga o "open session in view": a conexão com o banco fica aberta só dentro
# do service, e não durante toda a requisição (evita consultas escondidas no controller).
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true